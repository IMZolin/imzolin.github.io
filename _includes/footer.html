    <footer class="static-footer mt-3">
      <div class="container footer-inner">
        <div class="footer-copy">&copy; {{ site.time | date: '%Y' }} {{ site.first_name }} {{ site.last_name }}.</div>

        <div class="footer-socials">
          {%- for s in site.data.contact.socials %}{% if s.footer %}
          <a href="{{ s.url }}" title="{{ s.title }}" aria-label="{{ s.title }}"{% unless s.url contains 'mailto:' %} target="_blank" rel="noopener noreferrer"{% endunless %}><i class="{{ s.icon }}"></i></a>{% endif %}
          {%- endfor %}
        </div>

      </div>
    </footer>
