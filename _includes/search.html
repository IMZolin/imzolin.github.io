<!-- Site search modal (opened by header button or Cmd/Ctrl+K) -->
<div id="site-search" class="site-search" data-base="{{ site.baseurl }}" role="dialog" aria-modal="true" aria-label="Search" data-i18n-attr="aria-label:search.label" hidden>
  <div class="site-search-panel">
    <input id="site-search-input" class="site-search-input" type="search" placeholder="Search…" autocomplete="off" aria-label="Search" data-i18n-attr="placeholder:search.placeholder;aria-label:search.label">
    <div id="site-search-results" class="site-search-results"></div>
    <div class="site-search-foot"><kbd>↑</kbd> <kbd>↓</kbd> <span data-i18n="search.navigate">navigate</span> · <kbd>Enter</kbd> <span data-i18n="search.open">open</span> · <kbd>Esc</kbd> <span data-i18n="search.close">close</span></div>
  </div>
</div>
<script defer src="{{ '/assets/js/search.js' | relative_url | bust_file_cache }}"></script>
