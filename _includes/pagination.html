{%- if paginator.total_pages > 1 -%}
<nav aria-label="Blog page navigation">
  <ul class="pagination justify-content-center">
    <li class="page-item page-prev {% unless paginator.previous_page %}disabled{% endunless %}">
      <a class="page-link" href="{{ paginator.previous_page_path | relative_url }}" tabindex="-1" aria-disabled="{{ paginator.previous_page }}">&larr; <span data-i18n="blog.newer">Newer</span></a>
    </li>
    {%- if paginator.page_trail -%}
      {% for trail in paginator.page_trail -%}
        <li class="page-item {% if page.url == trail.path %}active{% endif %}"><a class="page-link" href="{{ trail.path | relative_url }}" title="{{trail.title}}"{% if page.url == trail.path %} aria-current="page"{% endif %}>{{ trail.num }}</a></li>
      {% endfor -%}
    {%- endif -%}
    <li class="page-item page-next {% unless paginator.next_page %}disabled{% endunless %}">
      <a class="page-link" href="{{ paginator.next_page_path | relative_url }}"><span data-i18n="blog.older">Older</span> &rarr;</a>
    </li>
  </ul>
</nav>
{%- endif -%}
