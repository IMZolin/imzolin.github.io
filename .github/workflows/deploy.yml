name: deploy

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
  schedule:
    # Daily rebuild so a CV published from personal-os reaches the site without a push.
    - cron: '17 3 * * *'

permissions:
  contents: write

jobs:
  deploy:
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    steps:
    - name: Checkout 🛎️
      uses: actions/checkout@v3
    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2.2'
        bundler-cache: true
    - name: Fetch CV PDFs 📄
      run: |
        mkdir -p assets/pdf
        for f in cv.pdf cv_ru.pdf; do
          if curl -fsSL "https://raw.githubusercontent.com/IMZolin/IMZolin/main/$f" -o "assets/pdf/$f.tmp"; then
            mv "assets/pdf/$f.tmp" "assets/pdf/$f"
          else
            rm -f "assets/pdf/$f.tmp"
            echo "::warning::Could not refresh $f, using the committed copy"
          fi
        done
    - name: Install and Build 🔧
      run: |
        pip3 install --upgrade jupyter
        npm install -g mermaid.cli
        export JEKYLL_ENV=production
        bundle exec jekyll build
    - name: Deploy 🚀
      if: github.event_name != 'pull_request'
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: _site

